      <<: *asl-lab-env
      DVT_ASL_ROLE: registrar
      DVT_ASL_OWN_IP: ${DVT_NET:-172.30.0}.41
      DVT_ASL_ZONE: "${DVT_ASL_NODE_A:-199901}:${DVT_NET:-172.30.0}.42:${DVT_ASL_IAX_PORT:-4569} ${DVT_ASL_NODE_B:-199902}:${DVT_NET:-172.30.0}.43:${DVT_ASL_IAX_PORT:-4569} ${DVT_ASL_NODE_E:-299901}:${DVT_NET:-172.30.0}.44:${DVT_ASL_IAX_PORT:-4569} ${DVT_ASL_NODE_T:-299902}:${DVT_NET:-172.30.0}.30:${DVT_ASL_IAX_PORT:-4569} ${DVT_ASL_EDGE_NODE:-2999}:${DVT_NET:-172.30.0}.11:${DVT_ASL_IAX_PORT:-4569}"
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.41"}


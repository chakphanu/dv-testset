  # 199901 / 199902 / 299901 (e = stand-in for the future dv-edge-allstar). All from the
  # allstar image plus the lab agent (rig/asl-lab-agent.py, port 8099).
  asl-reg:
    <<: [*asl-lab, *limits-small]

# SPDX-License-Identifier: MIT
# dv-testset rig. scripts/run.sh is the normal entry point: it loads the
# settings and runs, from the repository root,
#   docker compose -p dvt -f rig/compose.yml --env-file .env.example \
#     [--env-file .env] [--env-file .local/rig.env] --profile core up -d --build
# Pins and settings live in .env.example (tracked; .env overrides it). Without
# the env files the builds fail on a placeholder base image name.
#
# Profiles
#   core     xlxd-ref, xlxd-sut, transcoder-ref, transcoder-sut, tester
#   allstar  AllStarLink 3 node (use together with core)
#   nxdn     NXDNReflector nxdn-ref (.50) peered with xlxd-ref and nxdn-sut (.51)
#            peered with xlxd-sut, on module DVT_NXDN_MODULE / TG DVT_NXDN_TG
#            (xlxd connects out to the reflector; set DVT_NXDN=on with it)
#   p25      P25Reflector p25-ref (.60) peered with xlxd-ref and p25-sut (.61)
#            peered with xlxd-sut, on module DVT_P25_MODULE (set DVT_P25=on with it)
#   interlink  xlxd-peer-sut (.12, XLX998) interlinked with xlxd-sut and
#            xlxd-peer-ref (.13, XLX998) with xlxd-ref on DVT_INTERLINK_MODULES
#            (set DVT_INTERLINK=on with it); built from XLXD_PEER_DIR (default ref).
#            Transit cases: xlxd-peer2-sut (.14, XLX997) is linked only with
#            xlxd-sut and xlxd-peer2-ref (.15, XLX997) only with xlxd-ref, so
#            the reflector under test sits between two XLX peers
#            (XLX998 <-> XLX999 <-> XLX997)
#   load     DVT_LOAD_MODULES load-node replicas (dvt-tester image, addresses
#            from <net>.128/25) each running DVT_LOAD_CMD against xlxd-sut
#   netem    tc netem sidecars on tester, xlxd-ref and xlxd-sut (egress)
#   urfd     URFd (.70, URF999, modules A-Z, no transcoder); DVT_REF_KIND=urfd
#            points the tester's reference (DVT_XLXD_REF) at it (capture-urfd)
#   mrefd    mrefd (.80, M17-REF, the M17 Project reflector) with configured
#            interlink peers M17-DVT / M17-DVU at the tester; DVT_REF_KIND=mrefd
#            points the tester's reference at it (capture-mrefd)
#   web      web-proxy (.90, https://dvt-web): TLS reverse proxy to dv-svc-web of the
#            sut (DVT_SUT_LAUNCH=native, rig/config/dv-router/web.toml); the tester
#            gets DVT_WEB=on, the CA is written to out/<run>/web/ca.pem
#   browser  browser (.91): `playwright run-server` (chromium, firefox, WebKit of the pinned
#            official Playwright image, rig/Dockerfile.browser) for the browser cases; used
#            together with web (--profile web,browser); the tester gets DVT_BROWSER=on and
#            DVT_BROWSER_WS=ws://<net>.91:3000/. Its own limit set x-limits-browser
#   capture  sniffers on xlxd-ref, xlxd-sut, transcoder-sut (capture-allstar: on
#            allstar, capture-nxdn: on nxdn-*, capture-p25: on p25-*)
#
# Variables set at run time (not pins)
#   DVT_SUT_USRP             on = xlxd-sut loads rig/config/xlxd.usrp.in (default off)
#   DVT_RUN_ID               output directory name under out/ (default manual)
#   DVT_UID, DVT_GID         tester user, owner of out/ files (default 1000)
#   DVT_AMBED_ADDR           transcoder for the wire cases (default transcoder-sut)
#   DVT_START_DELAY          seconds xlxd waits before starting (run.sh --capture: 3)
#
# Transcoders: the services get only generic settings, DVT_TRANSCODER_BIND
# (own address) and DVT_TRANSCODER_PEERS (xlxd + tester). Image-specific
# environment or command goes into the optional local override
# .local/compose.override.yml (gitignored), which run.sh adds with -f when it
# exists. See rig/compose.override.example.yml.
#
# XLXD_REF_IMAGE / XLXD_SUT_IMAGE (scripts/run.sh): a prebuilt reflector image
# replaces the build; run.sh adds an override with its argv and the config
# files mounted read-only under /xlxd/.
#
# DVT_TRANSCODER_FAKE=1 (scripts/run.sh): transcoder-sut runs the image built from
# Dockerfile.ambed-fake (service ambed-fake-build, build only) instead of
# TRANSCODER_SUT_IMAGE; transcoder-ref stays the real image.
#
# Fixed addresses: xlxd-ref .10, xlxd-sut .11, transcoder-ref .20,
# transcoder-sut .21, tester .30, allstar .40, web-proxy .90, browser .91.

name: dvt

# Resource limits: EVERY service carries one of these three sets (memory with
# swap equal to it, so no swap; cpus quota; pids). run.sh refuses to start a
# rig in which a service lacks them (dvtest/limits.py). Sizes are settings in
# .env.example (DVT_MEM_*, DVT_CPUS_*, DVT_PIDS_*); README, "Resource limits".
#   small   sniffers, netem sidecars, NXDN/P25 reflectors, G3 relay, load nodes
#   medium  xlxd, transcoders, URFd, mrefd, AllStarLink (the systems under test)
#   tester  the pytest runner
#   browser the Playwright browsers (chromium + firefox + WebKit at once; shm_size is part of the memory cap)
x-limits-small: &limits-small
  mem_limit: ${DVT_MEM_SMALL:-256m}
  memswap_limit: ${DVT_MEM_SMALL:-256m}
  cpus: ${DVT_CPUS_SMALL:-0.5}
  pids_limit: ${DVT_PIDS_SMALL:-128}
x-limits-medium: &limits-medium
  mem_limit: ${DVT_MEM_MEDIUM:-512m}
  memswap_limit: ${DVT_MEM_MEDIUM:-512m}
  cpus: ${DVT_CPUS_MEDIUM:-2}
  pids_limit: ${DVT_PIDS_MEDIUM:-512}
x-limits-browser: &limits-browser
  mem_limit: ${DVT_MEM_BROWSER:-3g}
  memswap_limit: ${DVT_MEM_BROWSER:-3g}
  cpus: ${DVT_CPUS_BROWSER:-2}
  pids_limit: ${DVT_PIDS_BROWSER:-1024}
x-limits-tester: &limits-tester
  mem_limit: ${DVT_MEM_TESTER:-2g}
  memswap_limit: ${DVT_MEM_TESTER:-2g}
  cpus: ${DVT_CPUS_TESTER:-2}
  pids_limit: ${DVT_PIDS_TESTER:-512}

# Compiler jobs inside image builds (never "$(nproc)": that is the host's
# core count); scripts/contained.sh sets DVT_BUILD_JOBS for the whole run.
x-build-jobs: &build-jobs
  MAKE_JOBS: ${DVT_BUILD_JOBS:-4}

x-xlxd: &xlxd
  <<: *limits-medium
  profiles: [core]
  init: true
  restart: "no"

# netem sidecars (profile netem): each shares the namespace of its target and
# shapes its eth0 egress; DVT_NETEM_ARGS_* are resolved by run.sh from presets.
x-netem: &netem
  <<: *limits-small
  profiles: [netem]
  init: true
  image: dvt-netem:local
  build:
    context: .
    dockerfile: Dockerfile.netem
    args:
      NETEM_BASE_IMAGE: ${NETEM_BASE_IMAGE:-error-set-netem-base-image-see-env-example}
      IPROUTE2_VERSION: ${IPROUTE2_VERSION:-}
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]

# One sniffer per watched service: shares its network namespace and writes
# out/<run>/capture/<service>.pcapng (dumpcap stops at CAPTURE_FILESIZE_KB).
x-capture: &capture
  <<: *limits-small
  profiles: [capture]
  init: true
  image: dvt-capture:local
  build:
    context: .
    dockerfile: Dockerfile.capture
    args:
      CAPTURE_BASE_IMAGE: ${CAPTURE_BASE_IMAGE:-error-set-capture-base-image-see-env-example}
      TSHARK_VERSION: ${TSHARK_VERSION:-}
  user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
  cap_drop: [ALL]
  cap_add: [NET_RAW, NET_ADMIN]
  volumes:
    - ../out:/out
  entrypoint:
    - /bin/sh
    - -c
    # first start: <service>.pcapng; a restart (service restarted through
    # the control channel) continues in <service>.2.pcapng, .3, ...
    - >-
      d="/out/${DVT_RUN_ID:-manual}/capture"; f="$$d/$$0.pcapng"; n=1;
      while [ -e "$$f" ]; do n=$$((n+1)); f="$$d/$$0.$$n.pcapng"; done;
      exec dumpcap -q -i eth0 -a filesize:${CAPTURE_FILESIZE_KB:-65536} -w "$$f"

services:
  xlxd-ref:
    <<: *xlxd
    image: dvt-xlxd:${XLXD_REF_DIR:-ref}
    build:
      context: .
      dockerfile: Dockerfile.xlxd
      args: &xlxd-args
        <<: *build-jobs
        XLXD_BASE_IMAGE: ${XLXD_BASE_IMAGE:-error-set-xlxd-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/xlxd/${XLXD_REF_DIR:-ref}
    environment:
      DVT_CALLSIGN: XLX999
      # operator blacklist (P-G3-05; affects every protocol, default empty)
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_IP: ${DVT_NET:-172.30.0}.10
      DVT_TRANSCODER: ${DVT_NET:-172.30.0}.20
      DVT_USRP: "off"
      DVT_NXDN: ${DVT_NXDN:-off}
      DVT_NXDN_PEER: ${DVT_NET:-172.30.0}.50
      DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
      DVT_NXDN_MODULE: ${DVT_NXDN_MODULE:-F}
      # second NX row: the tester plays the reflector (cases/proto/test_nxdn_peer.py)
      DVT_NXDN_PROBE_PEER: ${DVT_NET:-172.30.0}.30:41410
      DVT_NXDN_PROBE_TG: ${DVT_NXDN_PROBE_TG:-31673}
      DVT_NXDN_PROBE_MODULE: ${DVT_NXDN_PROBE_MODULE:-I}
      DVT_P25: ${DVT_P25:-off}
      DVT_P25_PEER: ${DVT_NET:-172.30.0}.60
      DVT_P25_TG: ${DVT_P25_TG:-31672}
      DVT_P25_MODULE: ${DVT_P25_MODULE:-G}
      DVT_INTERLINK: ${DVT_INTERLINK:-off}
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.13
      DVT_INTERLINK_CALLSIGN: XLX998
      DVT_INTERLINK2_PEER: ${DVT_NET:-172.30.0}.15
      DVT_INTERLINK2_CALLSIGN: XLX997
      DVT_INTERLINK_TESTER: ${DVT_NET:-172.30.0}.30
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.10"}

  xlxd-sut:
    <<: *xlxd
    # the system under test may run many processes (DV-Router: launcher plus
    # about 25 children, 392 pids measured): own pids cap, still a cap
    pids_limit: ${DVT_PIDS_SUT:-1024}
    mem_limit: ${DVT_MEM_SUT:-1g}
    memswap_limit: ${DVT_MEM_SUT:-1g}
    image: dvt-xlxd:${XLXD_SUT_DIR:-sut}
    build:
      context: .
      dockerfile: Dockerfile.xlxd
      args: *xlxd-args
      additional_contexts:
        src: ../.cache/xlxd/${XLXD_SUT_DIR:-sut}
    environment:
      DVT_CALLSIGN: XLX999
      # operator blacklist (P-G3-05; affects every protocol, default empty)
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_IP: ${DVT_NET:-172.30.0}.11
      DVT_TRANSCODER: ${DVT_NET:-172.30.0}.21
      DVT_USRP: ${DVT_SUT_USRP:-off}
      DVT_NXDN: ${DVT_NXDN:-off}
      DVT_NXDN_PEER: ${DVT_NET:-172.30.0}.51
      DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
      DVT_NXDN_MODULE: ${DVT_NXDN_MODULE:-F}
      # second NX row: the tester plays the reflector (cases/proto/test_nxdn_peer.py)
      DVT_NXDN_PROBE_PEER: ${DVT_NET:-172.30.0}.30:41411
      DVT_NXDN_PROBE_TG: ${DVT_NXDN_PROBE_TG:-31673}
      DVT_NXDN_PROBE_MODULE: ${DVT_NXDN_PROBE_MODULE:-I}
      DVT_P25: ${DVT_P25:-off}
      DVT_P25_PEER: ${DVT_NET:-172.30.0}.61
      DVT_P25_TG: ${DVT_P25_TG:-31672}
      DVT_P25_MODULE: ${DVT_P25_MODULE:-G}
      DVT_INTERLINK: ${DVT_INTERLINK:-off}
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.12
      DVT_INTERLINK_CALLSIGN: XLX998
      DVT_INTERLINK2_PEER: ${DVT_NET:-172.30.0}.14
      DVT_INTERLINK2_CALLSIGN: XLX997
      DVT_INTERLINK_TESTER: ${DVT_NET:-172.30.0}.30
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
      DVT_NET: ${DVT_NET:-172.30.0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.11"}

  transcoder-ref:
    <<: *limits-medium
    profiles: [core]
    init: true
    image: ${TRANSCODER_REF_IMAGE:-${TRANSCODER_IMAGE:-error-set-transcoder-image-env}}
    environment:
      DVT_TRANSCODER_BIND: ${DVT_NET:-172.30.0}.20
      # xlxd plus the tester (wire cases talk to the transcoder directly)
      DVT_TRANSCODER_PEERS: ${DVT_NET:-172.30.0}.10 ${DVT_NET:-172.30.0}.30
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.20"}

  transcoder-sut:
    <<: *limits-medium
    profiles: [core]
    init: true
    image: ${TRANSCODER_SUT_IMAGE:-${TRANSCODER_IMAGE:-error-set-transcoder-image-env}}
    environment:
      DVT_TRANSCODER_BIND: ${DVT_NET:-172.30.0}.21
      # xlxd plus the tester (wire cases talk to the transcoder directly)
      DVT_TRANSCODER_PEERS: ${DVT_NET:-172.30.0}.11 ${DVT_NET:-172.30.0}.30
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.21"}

  # Build-only service: DVT_TRANSCODER_FAKE=1 (scripts/run.sh) builds this image
  # and uses it as transcoder-sut (TRANSCODER_SUT_IMAGE). Its profile is never
  # selected for "up", so it is never started; the limits stay set (run.sh
  # checks the build-only profile too).
  ambed-fake-build:
    <<: *limits-small
    profiles: [ambed-fake-build]
    image: dvt-ambed-fake:local
    build:
      context: .
      dockerfile: Dockerfile.ambed-fake
      args:
        <<: *build-jobs
        TESTER_BASE_IMAGE: ${TESTER_BASE_IMAGE:-error-set-tester-base-image-see-env-example}
      additional_contexts:
        dvtest: ../dvtest

  tester:
    <<: *limits-tester
    profiles: [core]
    init: true
    image: dvt-tester:local
    build:
      context: .
      dockerfile: Dockerfile.tester
      args:
        <<: *build-jobs
        TESTER_BASE_IMAGE: ${TESTER_BASE_IMAGE:-error-set-tester-base-image-see-env-example}
        PYTEST_VERSION: ${PYTEST_VERSION:-}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
      additional_contexts:
        codec2: ../.cache/codec2
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    environment:
      # the reference reflector: xlxd-ref (.10), URFd (.70) when DVT_REF_KIND=urfd,
      # mrefd (.80) when DVT_REF_KIND=mrefd
      DVT_XLXD_REF: ${DVT_NET:-172.30.0}.${DVT_REF_OCTET:-10}
      DVT_REF_KIND: ${DVT_REF_KIND:-xlxd}
      DVT_URFD: ${DVT_NET:-172.30.0}.70
      DVT_MREFD: ${DVT_NET:-172.30.0}.80
      # mrefd profile: reflector modules and the interlink peers the tester plays
      DVT_M17_MODULES: ${DVT_M17_MODULES:-MNOP}
      DVT_MREFD_CALLSIGN: ${DVT_MREFD_CALLSIGN:-M17-REF}
      DVT_M17_PEER_DVT_PORT: ${DVT_M17_PEER_DVT_PORT:-17011}
      DVT_M17_PEER_DVT_MODULES: ${DVT_M17_PEER_DVT_MODULES:-M}
      DVT_M17_PEER_DVU_PORT: ${DVT_M17_PEER_DVU_PORT:-17012}
      DVT_M17_PEER_DVU_MODULES: ${DVT_M17_PEER_DVU_MODULES:-MN}
      # mrefd keys peers by IP only: its M17-DVT peer is the tester address, its
      # M17-DVU peer an extra tester address added by the tester-addr sidecar
      DVT_M17_PEER_DVT_HOST: ${DVT_M17_PEER_DVT_HOST:-${DVT_NET:-172.30.0}.30}
      DVT_M17_PEER_DVU_HOST: ${DVT_M17_PEER_DVU_HOST:-${DVT_NET:-172.30.0}.32}
      # profile web (cases/web_fixtures.py): on when web-proxy runs; CA and operator login in $DVT_OUT/web/
      DVT_WEB: ${DVT_WEB:-off}
      DVT_WEB_URL: https://${DVT_WEB_HOST:-dvt-web}
      DVT_WEB_PROXY: ${DVT_NET:-172.30.0}.90
      DVT_ADMIN_URL: https://${DVT_ADMIN_HOST:-dvt-admin}:${DVT_ADMIN_PORT:-8443}
      # profile browser (cases/browser_fixtures.py): on when the browser service runs
      DVT_BROWSER: ${DVT_BROWSER:-off}
      # on when rig/config/dv-router/recorder.toml is part of DVT_SUT_CONFIG_EXTRA (run.sh)
      DVT_RECORDER: ${DVT_RECORDER:-off}
      DVT_BROWSER_WS: ws://${DVT_NET:-172.30.0}.91:${DVT_BROWSER_PORT:-3000}/
      # how xlxd-sut starts (direct | import | native); the M17 peer cases skip with import
      DVT_SUT_LAUNCH: ${DVT_SUT_LAUNCH:-direct}
      # [data] require_ident of the native config (rig/config/dv-router/data-ident.toml); cases/test_data_ident.py
      DVT_REQUIRE_IDENT: ${DVT_REQUIRE_IDENT:-true}
      DVT_XLXD_SUT: ${DVT_NET:-172.30.0}.11
      DVT_AMBED_REF: ${DVT_NET:-172.30.0}.20
      DVT_AMBED_SUT: ${DVT_NET:-172.30.0}.21
      DVT_ALLSTAR: ${DVT_NET:-172.30.0}.40
      DVT_SUBNET: ${DVT_NET:-172.30.0}.0/24
      DVT_NXDN: ${DVT_NXDN:-off}
      DVT_NXDN_REF: ${DVT_NET:-172.30.0}.50
      DVT_NXDN_SUT: ${DVT_NET:-172.30.0}.51
      DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
      DVT_NXDN_MODULE: ${DVT_NXDN_MODULE:-F}
      DVT_NXDN_PROBE_TG: ${DVT_NXDN_PROBE_TG:-31673}
      DVT_NXDN_PROBE_MODULE: ${DVT_NXDN_PROBE_MODULE:-I}
      DVT_NXDN_PROBE_PORT_REF: "41410"
      DVT_NXDN_PROBE_PORT_SUT: "41411"
      DVT_P25: ${DVT_P25:-off}
      DVT_P25_REF: ${DVT_NET:-172.30.0}.60
      DVT_P25_SUT: ${DVT_NET:-172.30.0}.61
      DVT_P25_TG: ${DVT_P25_TG:-31672}
      DVT_P25_MODULE: ${DVT_P25_MODULE:-G}
      DVT_INTERLINK: ${DVT_INTERLINK:-off}
      DVT_XLXD_PEER_SUT: ${DVT_NET:-172.30.0}.12
      DVT_XLXD_PEER_REF: ${DVT_NET:-172.30.0}.13
      DVT_XLXD_PEER2_SUT: ${DVT_NET:-172.30.0}.14
      DVT_XLXD_PEER2_REF: ${DVT_NET:-172.30.0}.15
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_UNSERVED_MODULE: ${DVT_UNSERVED_MODULE:-}
      # on with --profile g3: g3-term2 at .31 is a second G3 terminal (cases/proto/test_g3.py)
      DVT_G3: ${DVT_G3:-off}
      # the operator blacklist both reflectors got (P-G3-05 checks it is set)
      DVT_XLXD_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      # dynamic USRP idle timeout the sut was given (P-USR-31/32 wait it out)
      DVT_USRP_IDLE_TIMEOUT_S: ${DVT_USRP_IDLE_TIMEOUT_S:-}
      # no-radio-id policy the sut was given (drop|fallback|local; empty = its default)
      DVT_NO_RADIO_ID: ${DVT_NO_RADIO_ID:-}
      DVT_LOAD: ${DVT_LOAD:-off}
      DVT_LOAD_MODULES: ${DVT_LOAD_MODULES:-26}
      DVT_LOAD_START_AT: ${DVT_LOAD_START_AT:-0}
      DVT_LOAD_DURATION: ${DVT_LOAD_DURATION:-60}
      # names (comma separated, dvtest/divergences.py) of intended differences
      # of the system under test from xlxd-ref
      DVT_SUT_DIVERGENCES: ${DVT_SUT_DIVERGENCES:-}
      # short name of the system under test (baselines/<name>/ for per-sut numbers)
      DVT_SUT_NAME: ${DVT_SUT_NAME:-}
      # behaviour spec the system under test is held to (dvtest/specs/)
      DVT_SUT_PROFILE: ${DVT_SUT_PROFILE:-xlxd}
      # 1 = transcoder-sut is the fake extended AMBEd (docs/ambed-fake.md; control <net>.21:10190)
      DVT_TRANSCODER_FAKE: ${DVT_TRANSCODER_FAKE:-}
      # wire cases: transcoder under test when run inside the rig
      DVT_AMBED_ADDR: ${DVT_AMBED_ADDR:-${DVT_NET:-172.30.0}.21}
      # on when xlxd-sut has USRP endpoints (A/B -> allstar, C -> tester)
      DVT_SUT_USRP: ${DVT_SUT_USRP:-off}
      DVT_OUT: /dvt/out/${DVT_RUN_ID:-manual}
      HOME: /tmp
    env_file:
      - path: ../.local/rig.env
        required: false
    volumes:
      - ..:/dvt
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.30"}

  allstar:
    <<: *limits-medium
    profiles: [allstar]
    init: true
    image: dvt-allstar:local
    build:
      context: .
      dockerfile: Dockerfile.allstar
      args:
        ALLSTAR_BASE_IMAGE: ${ALLSTAR_BASE_IMAGE:-error-set-allstar-base-image-see-env-example}
        ASL_REPO_DEB_URL: ${ASL_REPO_DEB_URL:-}
        ASL_REPO_DEB_SHA256: ${ASL_REPO_DEB_SHA256:-}
        ASL3_ASTERISK_VERSION: ${ASL3_ASTERISK_VERSION:-}
    environment:
      DVT_NET: ${DVT_NET:-172.30.0}
    env_file:
      - path: ../.local/rig.env
        required: false
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.40"}

  # ---- sniffers (profile capture; capture-allstar also needs allstar) ----
  capture-xlxd-ref:
    <<: *capture
    network_mode: "service:xlxd-ref"
    depends_on:
      xlxd-ref: {condition: service_started, restart: false}
    command: ["xlxd-ref"]

  capture-xlxd-sut:
    <<: *capture
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    command: ["xlxd-sut"]

  capture-transcoder-sut:
    <<: *capture
    network_mode: "service:transcoder-sut"
    depends_on:
      transcoder-sut: {condition: service_started, restart: false}
    command: ["transcoder-sut"]

  capture-allstar:
    <<: *capture
    profiles: [capture-allstar]
    network_mode: "service:allstar"
    depends_on:
      allstar: {condition: service_started, restart: false}
    command: ["allstar"]

  # ---- NXDNReflector (profile nxdn) ----
  nxdn-ref:
    <<: &nxdn
      <<: *limits-small
      profiles: [nxdn]
      init: true
      image: dvt-nxdnreflector:local
      build:
        context: .
        dockerfile: Dockerfile.nxdnreflector
        args:
          <<: *build-jobs
          NXDN_BASE_IMAGE: ${NXDN_BASE_IMAGE:-error-set-nxdn-base-image-see-env-example}
        additional_contexts:
          src: ../.cache/nxdnclients
      environment:
        DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.50"}

  nxdn-sut:
    <<: *nxdn
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.51"}

  capture-nxdn-ref:
    <<: *capture
    profiles: [capture-nxdn]
    network_mode: "service:nxdn-ref"
    depends_on:
      nxdn-ref: {condition: service_started, restart: false}
    command: ["nxdn-ref"]

  capture-nxdn-sut:
    <<: *capture
    profiles: [capture-nxdn]
    network_mode: "service:nxdn-sut"
    depends_on:
      nxdn-sut: {condition: service_started, restart: false}
    command: ["nxdn-sut"]

  # ---- P25Reflector (profile p25) ----
  p25-ref:
    <<: &p25
      <<: *limits-small
      profiles: [p25]
      init: true
      image: dvt-p25reflector:local
      build:
        context: .
        dockerfile: Dockerfile.p25reflector
        args:
          <<: *build-jobs
          P25_BASE_IMAGE: ${P25_BASE_IMAGE:-error-set-p25-base-image-see-env-example}
        additional_contexts:
          src: ../.cache/p25clients
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.60"}

  p25-sut:
    <<: *p25
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.61"}

  capture-p25-ref:
    <<: *capture
    profiles: [capture-p25]
    network_mode: "service:p25-ref"
    depends_on:
      p25-ref: {condition: service_started, restart: false}
    command: ["p25-ref"]

  capture-p25-sut:
    <<: *capture
    profiles: [capture-p25]
    network_mode: "service:p25-sut"
    depends_on:
      p25-sut: {condition: service_started, restart: false}
    command: ["p25-sut"]

  # ---- URFd (profile urfd): a second reference reflector for compatibility
  # runs (DVT_REF_KIND=urfd). No transcoder: same-codec passthrough only.
  urfd:
    <<: *limits-medium
    profiles: [urfd]
    init: true
    image: dvt-urfd:local
    build:
      context: .
      dockerfile: Dockerfile.urfd
      args:
        <<: *build-jobs
        URFD_BASE_IMAGE: ${URFD_BASE_IMAGE:-error-set-urfd-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/urfd
    environment:
      DVT_IP: ${DVT_NET:-172.30.0}.70
      DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
      DVT_P25_TG: ${DVT_P25_TG:-31672}
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.70"}

  capture-urfd:
    <<: *capture
    profiles: [capture-urfd]
    network_mode: "service:urfd"
    depends_on:
      urfd: {condition: service_started, restart: false}
    command: ["urfd"]

  # ---- mrefd (profile mrefd): the M17 Project reflector, an extra reference
  # for the M17 cases (DVT_REF_KIND=mrefd). Interlink peers M17-DVT and
  # M17-DVU are configured at the tester, which plays them.
  mrefd:
    <<: *limits-medium
    profiles: [mrefd]
    init: true
    restart: "no"
    image: dvt-mrefd:local
    build:
      context: .
      dockerfile: Dockerfile.mrefd
      args:
        <<: *build-jobs
        MREFD_BASE_IMAGE: ${MREFD_BASE_IMAGE:-error-set-mrefd-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/mrefd
    environment:
      DVT_IP: ${DVT_NET:-172.30.0}.80
      DVT_MREFD_CALLSIGN: ${DVT_MREFD_CALLSIGN:-M17-REF}
      DVT_M17_MODULES: ${DVT_M17_MODULES:-MNOP}
      DVT_M17_PEER_IP: ${DVT_NET:-172.30.0}.30
      DVT_M17_PEER_DVT_PORT: ${DVT_M17_PEER_DVT_PORT:-17011}
      DVT_M17_PEER_DVT_MODULES: ${DVT_M17_PEER_DVT_MODULES:-M}
      DVT_M17_PEER_DVU_PORT: ${DVT_M17_PEER_DVU_PORT:-17012}
      DVT_M17_PEER_DVU_MODULES: ${DVT_M17_PEER_DVU_MODULES:-MN}
      DVT_M17_PEER_DVU_HOST: ${DVT_M17_PEER_DVU_HOST:-${DVT_NET:-172.30.0}.32}
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    depends_on:
      tester-addr: {condition: service_started, restart: false}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.80"}

  # Sidecar of the tester (profile mrefd): adds the second tester address
  # mrefd's M17-DVU peer is configured with (mrefd tells peers apart by IP
  # only). The tester has no NET_ADMIN; the image is the netem one (iproute2).
  tester-addr:
    <<: *netem
    profiles: [mrefd]
    network_mode: "service:tester"
    depends_on:
      tester: {condition: service_started, restart: false}
    environment:
      DVT_ADDR: ${DVT_M17_PEER_DVU_HOST:-${DVT_NET:-172.30.0}.32}
    entrypoint:
      - /bin/sh
      - -c
      - ip addr show dev eth0 | grep -q "inet $$DVT_ADDR/" || ip addr add "$$DVT_ADDR/24" dev eth0; exec sleep infinity

  # ---- TLS proxy for DV-Router's web service (profile web) ----
  # dv-svc-web speaks HTTP and sets a Secure __Host- cookie, so cases and browsers
  # need HTTPS: this proxy (dvtest/tools/tls_proxy.py) terminates TLS with a
  # throwaway CA made at start and writes the CA certificate to out/<run>/web/ca.pem
  # (the only place it can write); it forwards to the sut's :8081 with
  # X-Forwarded-Proto https and streams (SSE). The host name DVT_WEB_HOST is a
  # network alias; the certificate names it, localhost and the address. A second
# listener (8443, host dvt-admin) forwards to the admin service of the sut (:8080).
  web-proxy:
    <<: *limits-medium
    profiles: [web]
    init: true
    restart: "no"
    image: dvt-web-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.web-proxy
      args:
        TESTER_BASE_IMAGE: ${TESTER_BASE_IMAGE:-error-set-tester-base-image-see-env-example}
      additional_contexts:
        dvtest: ../dvtest
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --listen
      - 0.0.0.0:443
      - --upstream
      - ${DVT_NET:-172.30.0}.11:8081
      - --ca-out
      - /webout/ca.pem
      - --san-dns
      - ${DVT_WEB_HOST:-dvt-web}
      - --san-dns
      - localhost
      - --san-ip
      - ${DVT_NET:-172.30.0}.90
      - --san-ip
      - 127.0.0.1
      - --max-conns
      - ${DVT_WEB_PROXY_CONNS:-256}
      # the admin host of DV-Router (dv-svc-admin, rig/config/dv-router/admin.toml,
      # host = dvt-admin:8443): second TLS listener, same certificate and CA
      - --route
      - 0.0.0.0:${DVT_ADMIN_PORT:-8443}=${DVT_NET:-172.30.0}.11:8080
      - --san-dns
      - ${DVT_ADMIN_HOST:-dvt-admin}
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/web:/webout
    networks:
      rig:
        ipv4_address: "${DVT_NET:-172.30.0}.90"
        aliases:
          - ${DVT_WEB_HOST:-dvt-web}
          - ${DVT_ADMIN_HOST:-dvt-admin}

  # Browsers for the browser cases (profile browser, together with web): `playwright run-server`
  # of the pinned official Playwright image (rig/Dockerfile.browser). The tester connects with the
  # Playwright client (chromium.connect / firefox.connect / webkit.connect); the pages are loaded
  # by the browsers from THIS address (.91) through the rig network, so the web service sees a
  # client address that is not the tester's. Non-root user of the image, no capability, root
  # filesystem read-only, /tmp in memory, shm_size for chromium (inside the memory cap).
  browser:
    <<: *limits-browser
    profiles: [browser]
    init: true
    restart: "no"
    image: dvt-browser:local
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_BASE_IMAGE:-error-set-browser-base-image-see-env-example}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
    shm_size: ${DVT_SHM_BROWSER:-1g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=512m
      # WebKit buffers media in /var/tmp/WebKit-Media-* (playback fails with "Could not create temp file" on a read-only root)
      - /var/tmp:size=256m
    # --unsafe: lets a client pass launch args and Firefox prefs (the fake microphone of the listen/talk
    # cases: --use-fake-device-for-media-stream, media.navigator.streams.fake). The rig network is
    # internal and the container is the boundary; the server takes no connection from outside it.
    command: ["--host", "0.0.0.0", "--port", "${DVT_BROWSER_PORT:-3000}", "--unsafe"]
    volumes:
      # fake microphone file written by the tester at run time (read-only here, never committed)
      - ../out/${DVT_RUN_ID:-manual}/media:/media:ro
    networks:
      rig:
        ipv4_address: "${DVT_NET:-172.30.0}.91"

  capture-mrefd:
    <<: *capture
    profiles: [capture-mrefd]
    network_mode: "service:mrefd"
    depends_on:
      mrefd: {condition: service_started, restart: false}
    command: ["mrefd"]

  # ---- XLX interlink peers (profile interlink) ----
  xlxd-peer-sut:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: &xlxd-peer-build
      context: .
      dockerfile: Dockerfile.xlxd
      args: *xlxd-args
      additional_contexts:
        src: ../.cache/xlxd/${XLXD_PEER_DIR:-ref}
    environment:
      DVT_CALLSIGN: XLX998
      DVT_IP: ${DVT_NET:-172.30.0}.12
      # no transcoder: the interlink carries every codec as is
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.11
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.12"}

  xlxd-peer-ref:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX998
      DVT_IP: ${DVT_NET:-172.30.0}.13
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.10
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.13"}

  xlxd-peer2-sut:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX997
      DVT_IP: ${DVT_NET:-172.30.0}.14
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.11
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.14"}

  xlxd-peer2-ref:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX997
      DVT_IP: ${DVT_NET:-172.30.0}.15
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.10
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.15"}

  capture-xlxd-peer-sut:
    <<: *capture
    profiles: [capture-interlink]
    network_mode: "service:xlxd-peer-sut"
    depends_on:
      xlxd-peer-sut: {condition: service_started, restart: false}
    command: ["xlxd-peer-sut"]

  # ---- netem sidecars (profile netem) ----
  netem-tester:
    <<: *netem
    network_mode: "service:tester"
    depends_on:
      tester: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_TESTER:-}

  netem-xlxd-ref:
    <<: *netem
    network_mode: "service:xlxd-ref"
    depends_on:
      xlxd-ref: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_XLXD:-}

  netem-xlxd-sut:
    <<: *netem
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_XLXD:-}

  # ---- load (profile load): one client node per module ----
  # Each replica gets a dynamic address from <net>.128/25; DVT_LOAD_CMD (run
  # from /dvt) derives its module from that address (last octet - 128).
  load-node:
    <<: *limits-small
    profiles: [load]
    init: true
    image: dvt-tester:local
    scale: ${DVT_LOAD_NODES:-${DVT_LOAD_MODULES:-26}}
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    environment:
      DVT_LOAD_TARGET: ${DVT_NET:-172.30.0}.11
      DVT_LOAD_REF: ${DVT_NET:-172.30.0}.10
      DVT_LOAD_MODULES: ${DVT_LOAD_MODULES:-26}
      DVT_LOAD_START_AT: ${DVT_LOAD_START_AT:-0}
      DVT_LOAD_DURATION: ${DVT_LOAD_DURATION:-60}
      DVT_SUBNET: ${DVT_NET:-172.30.0}.0/24
      DVT_OUT: /dvt/out/${DVT_RUN_ID:-manual}
      HOME: /tmp
    volumes:
      - ..:/dvt
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ${DVT_LOAD_CMD:-python -m dvtest.load_node}"]
    networks: [rig]

  # ---- second Icom G3 terminal (profile g3) ----
  # G3 keys a terminal by IP: this relay gives the tester a second address.
  # The tester drives it over UDP 40100 (dvtest/proto/g3.py relay_main).
  g3-term2:
    <<: *limits-small
    profiles: [g3]
    init: true
    image: dvt-tester:local
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    working_dir: /dvt
    environment:
      HOME: /tmp
    volumes:
      - ..:/dvt
    entrypoint: ["python", "-m", "dvtest.proto.g3", "relay"]
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.31"}

networks:
  rig:
    # internal: no route out; nothing in the rig may reach the internet
    internal: true
    ipam:
      config:
        - subnet: ${DVT_NET:-172.30.0}.0/24
          # dynamic addresses (load-node replicas) stay above the fixed ones
          ip_range: ${DVT_NET:-172.30.0}.128/25

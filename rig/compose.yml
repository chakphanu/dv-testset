  # ---- profile asl-ext: the REAL node 400169, outbound only (docs/asl-edge-results.md "External dial T12") ----
  # The only service with internet access: it is on the internal rig network (for the tester's agent calls) and on
  # asl-ext-out, a normal bridge network that gives it a default route (docker NAT, nothing published). The
  # registration password is a file of the host (mode 0600), mounted read-only; the entry script turns it into
  # the Asterisk config inside the container. create_host_path false: a missing file is an error, never an empty
  # directory made by docker.
  asl-ext:
    <<: [*asl-lab, *limits-medium]
    profiles: [asl-ext]
    dns_search: ["."]
    environment:
      <<: *asl-lab-env
      DVT_ASL_ROLE: node-ext
      DVT_ASL_NODE: ${DVT_ASL_EXT_NODE:-400169}
      DVT_ASL_USRP_TX: "34104"
      DVT_ASL_USRP_RX: "32104"
      DVT_ASL_CAP_FILTER: "udp or tcp port 443 or tcp port 53"
      DVT_ASL_EXT_REGISTRY: ${DVT_ASL_EXT_REGISTRY:-register.allstarlink.org}
    volumes:
      - type: bind
        source: ../.local/secrets/asl-400169.pw
        target: /run/dvt-secret/node.pw
        read_only: true
        bind:
          create_host_path: false
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.45"}
      asl-ext-out: {}

  # ---- sniffers (profile capture; capture-allstar also needs allstar) ----
  capture-xlxd-ref:
    <<: *capture
    network_mode: "service:xlxd-ref"
    depends_on:
      xlxd-ref: {condition: service_started, restart: false}
    command: ["xlxd-ref"]

  capture-xlxd-sut:
    <<: *capture
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    command: ["xlxd-sut"]

  capture-transcoder-sut:
    <<: *capture
    network_mode: "service:transcoder-sut"
    depends_on:
      transcoder-sut: {condition: service_started, restart: false}
    command: ["transcoder-sut"]

  capture-allstar:
    <<: *capture
    profiles: [capture-allstar]
    network_mode: "service:allstar"
    depends_on:
      allstar: {condition: service_started, restart: false}
    command: ["allstar"]

  # ---- NXDNReflector (profile nxdn) ----
  nxdn-ref:
    <<: &nxdn
      <<: *limits-small
      profiles: [nxdn]
      init: true
      image: dvt-nxdnreflector:local
      build:
        context: .
        dockerfile: Dockerfile.nxdnreflector
        args:
          <<: *build-jobs
          NXDN_BASE_IMAGE: ${NXDN_BASE_IMAGE:-error-set-nxdn-base-image-see-env-example}
        additional_contexts:
          src: ../.cache/nxdnclients
      environment:
        DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.50"}

  nxdn-sut:
    <<: *nxdn
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.51"}

  capture-nxdn-ref:
    <<: *capture
    profiles: [capture-nxdn]
    network_mode: "service:nxdn-ref"
    depends_on:
      nxdn-ref: {condition: service_started, restart: false}
    command: ["nxdn-ref"]

  capture-nxdn-sut:
    <<: *capture
    profiles: [capture-nxdn]
    network_mode: "service:nxdn-sut"
    depends_on:
      nxdn-sut: {condition: service_started, restart: false}
    command: ["nxdn-sut"]

  # ---- P25Reflector (profile p25) ----
  p25-ref:
    <<: &p25
      <<: *limits-small
      profiles: [p25]
      init: true
      image: dvt-p25reflector:local
      build:
        context: .
        dockerfile: Dockerfile.p25reflector
        args:
          <<: *build-jobs
          P25_BASE_IMAGE: ${P25_BASE_IMAGE:-error-set-p25-base-image-see-env-example}
        additional_contexts:
          src: ../.cache/p25clients
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.60"}

  p25-sut:
    <<: *p25
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.61"}

  capture-p25-ref:
    <<: *capture
    profiles: [capture-p25]
    network_mode: "service:p25-ref"
    depends_on:
      p25-ref: {condition: service_started, restart: false}
    command: ["p25-ref"]

  capture-p25-sut:
    <<: *capture
    profiles: [capture-p25]
    network_mode: "service:p25-sut"
    depends_on:
      p25-sut: {condition: service_started, restart: false}
    command: ["p25-sut"]

  # ---- URFd (profile urfd): a second reference reflector for compatibility
  # runs (DVT_REF_KIND=urfd). No transcoder: same-codec passthrough only.
  urfd:
    <<: *limits-medium
    profiles: [urfd]
    init: true
    image: dvt-urfd:local
    build:
      context: .
      dockerfile: Dockerfile.urfd
      args:
        <<: *build-jobs
        URFD_BASE_IMAGE: ${URFD_BASE_IMAGE:-error-set-urfd-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/urfd
    environment:
      DVT_IP: ${DVT_NET:-172.30.0}.70
      DVT_NXDN_TG: ${DVT_NXDN_TG:-31672}
      DVT_P25_TG: ${DVT_P25_TG:-31672}
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.70"}

  capture-urfd:
    <<: *capture
    profiles: [capture-urfd]
    network_mode: "service:urfd"
    depends_on:
      urfd: {condition: service_started, restart: false}
    command: ["urfd"]

  # ---- mrefd (profile mrefd): the M17 Project reflector, an extra reference
  # for the M17 cases (DVT_REF_KIND=mrefd). Interlink peers M17-DVT and
  # M17-DVU are configured at the tester, which plays them.
  mrefd:
    <<: *limits-medium
    profiles: [mrefd]
    init: true
    restart: "no"
    image: dvt-mrefd:local
    build:
      context: .
      dockerfile: Dockerfile.mrefd
      args:
        <<: *build-jobs
        MREFD_BASE_IMAGE: ${MREFD_BASE_IMAGE:-error-set-mrefd-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/mrefd
    environment:
      DVT_IP: ${DVT_NET:-172.30.0}.80
      DVT_MREFD_CALLSIGN: ${DVT_MREFD_CALLSIGN:-M17-REF}
      DVT_M17_MODULES: ${DVT_M17_MODULES:-MNOP}
      DVT_M17_PEER_IP: ${DVT_NET:-172.30.0}.30
      DVT_M17_PEER_DVT_PORT: ${DVT_M17_PEER_DVT_PORT:-17011}
      DVT_M17_PEER_DVT_MODULES: ${DVT_M17_PEER_DVT_MODULES:-M}
      DVT_M17_PEER_DVU_PORT: ${DVT_M17_PEER_DVU_PORT:-17012}
      DVT_M17_PEER_DVU_MODULES: ${DVT_M17_PEER_DVU_MODULES:-MN}
      DVT_M17_PEER_DVU_HOST: ${DVT_M17_PEER_DVU_HOST:-${DVT_NET:-172.30.0}.32}
      DVT_BLACKLIST: ${DVT_XLXD_BLACKLIST:-}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    depends_on:
      tester-addr: {condition: service_started, restart: false}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.80"}

  # Sidecar of the tester (profile mrefd): adds the second tester address
  # mrefd's M17-DVU peer is configured with (mrefd tells peers apart by IP
  # only). The tester has no NET_ADMIN; the image is the netem one (iproute2).
  tester-addr:
    <<: *netem
    profiles: [mrefd]
    network_mode: "service:tester"
    depends_on:
      tester: {condition: service_started, restart: false}
    environment:
      DVT_ADDR: ${DVT_M17_PEER_DVU_HOST:-${DVT_NET:-172.30.0}.32}
    entrypoint:
      - /bin/sh
      - -c
      - ip addr show dev eth0 | grep -q "inet $$DVT_ADDR/" || ip addr add "$$DVT_ADDR/24" dev eth0; exec sleep infinity

  # ---- TLS proxy for DV-Router's web service (profile web) ----
  # dv-svc-web speaks HTTP and sets a Secure __Host- cookie, so cases and browsers
  # need HTTPS: this proxy (dvtest/tools/tls_proxy.py) terminates TLS with a
  # throwaway CA made at start and writes the CA certificate to out/<run>/web/ca.pem
  # (the only place it can write); it forwards to the sut's :8081 with
  # X-Forwarded-Proto https and streams (SSE). The host name DVT_WEB_HOST is a
  # network alias; the certificate names it, localhost and the address. A second
# listener (8443, host dvt-admin) forwards to the admin service of the sut (:8080).
  web-proxy:
    <<: *limits-medium
    profiles: [web]
    init: true
    restart: "no"
    image: dvt-web-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.web-proxy
      args:
        TESTER_BASE_IMAGE: ${TESTER_BASE_IMAGE:-error-set-tester-base-image-see-env-example}
      additional_contexts:
        dvtest: ../dvtest
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --listen
      - 0.0.0.0:443
      - --upstream
      - ${DVT_NET:-172.30.0}.11:8081
      - --ca-out
      - /webout/ca.pem
      - --san-dns
      - ${DVT_WEB_HOST:-dvt-web}
      - --san-dns
      - localhost
      - --san-ip
      - ${DVT_NET:-172.30.0}.90
      - --san-ip
      - 127.0.0.1
      - --max-conns
      - ${DVT_WEB_PROXY_CONNS:-256}
      # the admin host of DV-Router (dv-svc-admin, rig/config/dv-router/admin.toml,
      # host = dvt-admin:8443): second TLS listener, same certificate and CA
      - --route
      - 0.0.0.0:${DVT_ADMIN_PORT:-8443}=${DVT_NET:-172.30.0}.11:8080
      - --san-dns
      - ${DVT_ADMIN_HOST:-dvt-admin}
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/web:/webout
    networks:
      rig:
        ipv4_address: "${DVT_NET:-172.30.0}.90"
        aliases:
          - ${DVT_WEB_HOST:-dvt-web}
          - ${DVT_ADMIN_HOST:-dvt-admin}

  # ---- profile aprs: a PRIVATE aprsc (APRS-IS server) for the APRS-IS cases of DV-Router (DP15-5a / 5b,
  # docs/dp15-cases.md). Standalone: no uplink, no HTTP port, one client port 14580 (rig/config/aprsc/aprsc.conf,
  # mounted read-only over the copy baked into the image); it sits on the internal rig network only, so it can never
  # reach the public APRS-IS network. Nothing is published. The image runs as its own non-root user (uid 10004) on a
  # read-only root with a tmpfs /tmp (RunDir and pid file); the log goes to stderr (out/<run>/logs/aprsc.log).
  aprsc:
    <<: *limits-small
    profiles: [aprs]
    init: true
    restart: "no"
    image: dvt-aprsc:local
    build:
      context: .
      dockerfile: Dockerfile.aprsc
      args:
        <<: *build-jobs
        APRSC_BASE_IMAGE: ${APRSC_BASE_IMAGE:-error-set-aprsc-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/aprsc
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config/aprsc/aprsc.conf:/etc/aprsc/aprsc.conf:ro
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.47"}

  # ---- profile mapsrc: the source of the lazy basemap region worker (MAP2d; cases/test_map2d_regions.py, docs/map2d-cases.md).
  # dv-svc-basemap accepts an http source only at the literal address 127.0.0.1 / [::1], so the fixture server
  # (dvtest/basemap_fixture.py: builds.json, a PMTiles archive with HEAD / Range / If-Match / strong ETag) shares the network
  # namespace of xlxd-sut and listens on ITS loopback, port 18700 (rig/config/dv-router/map2d-source.toml names it). The stats
  # listener on 0.0.0.0:18701 serves only the request log (GET /requests) to the tester at ${DVT_NET}.11:18701. The SUT image has
  # no shell or python, so the sidecar uses the tester image with the repository mounted read-only. A restart of xlxd-sut leaves
  # this sidecar in the old namespace (the capture sidecars are recreated, this one is not): the case never restarts the SUT.
  basemap-src:
    <<: *limits-small
    profiles: [mapsrc]
    init: true
    restart: "no"
    image: dvt-tester:local
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
    volumes:
      - ..:/dvt:ro
    command:
      - python3
      - -m
      - dvtest.basemap_fixture
      - serve
      - --host
      - 127.0.0.1
      - --port
      - "18700"
      - --stats-bind
      - 0.0.0.0:18701
      - --access-log

  # ---- profile dw: two real Dire Wolf TNCs on a modem loop for the DP15 RF cases of tier B (docs/dp15-cases.md,
  # cases/test_dp15_rf_dw.py). Image dvt-direwolf:local (rig/Dockerfile.direwolf, source .cache/direwolf from
  # scripts/pre-fetch-direwolf.sh), entry.py loop: one Dire Wolf per container, KISS TCP on 8001 (the AX.25 edge of the SUT
  # and the tester are its clients; 3 clients at most), audio in on udp 7355, and the audio the TNC TRANSMITS goes (ALSA file
  # PCM -> FIFO -> relay) as UDP to the audio input of the other one: a frame sent into dw-a's KISS port is demodulated by
  # dw-b and handed to dw-b's KISS clients, and the other way round. No sound card, no hardware, rig network only, nothing
  # published. Read-only root, tmpfs /tmp (FIFO, configuration), no capabilities, uid 10003. The log goes to stdout
  # (out/<run>/logs/dw-a.log). Each address is the other one's DW_PEER.
  dw-a: &dw
    <<: *limits-small
    profiles: [dw]
    init: true
    restart: "no"
    image: dvt-direwolf:local
    build:
      context: .
      dockerfile: Dockerfile.direwolf
      args:
        <<: *build-jobs
        DIREWOLF_BASE_IMAGE: ${DIREWOLF_BASE_IMAGE:-error-set-direwolf-base-image-see-env-example}
      additional_contexts:
        src: ../.cache/direwolf
    command: ["loop"]
    environment:
      DW_NAME: a
      DW_MYCALL: N0TEST-8
      DW_KISS_PORT: "8001"
      DW_AUDIO_PORT: "7355"
      DW_PEER: ${DVT_NET:-172.30.0}.49:7355
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.48"}

  dw-b:
    <<: *dw
    environment:
      DW_NAME: b
      DW_MYCALL: N0TEST-9
      DW_KISS_PORT: "8001"
      DW_AUDIO_PORT: "7355"
      DW_PEER: ${DVT_NET:-172.30.0}.48:7355
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.49"}

  # ---- The real client stack of a hotspot (profile mmdvm; docs/mmdvm-stack-cases.md) ----
  # Upstream MMDVMHost with DMRGateway, YSFGateway, P25Gateway, NXDNGateway and DStarGateway (GPL programs, built from the pinned
  # sources of .env.example by rig/Dockerfile.mmdvmstack, run as processes by rig/mmdvmstack-entry.sh) against xlxd-sut. MMDVMHost's
  # modem is the VIRTUAL MMDVM modem of dvtest/mmdvm_modem.py: the tester listens on UDP MODEM_PORT and MMDVMHost ([Modem] Protocol=udp)
  # talks to it from LOCAL_PORT, so no serial line, no pty and no hardware are involved. Nothing in the container needs the internet
  # (every host file points at the reflector). Read-only root, tmpfs /tmp (the rendered configuration), no capabilities, uid 10005.
  # The log of all the programs, each line prefixed with its name, goes to stdout: out/<run>/logs/mmdvm-stack.log. The gateways link
  # at start; `stop mmdvm-stack` through the control channel makes them unlink (SIGTERM, 20 s grace). The limit set is small
  # (about 60 MB for the seven processes); the task limit is higher than the other small services (several programs with threads).
  mmdvm-stack:
    <<: *limits-small
    pids_limit: ${DVT_PIDS_MMDVM:-256}
    profiles: [mmdvm]
    init: true
    restart: "no"
    stop_grace_period: 20s
    image: dvt-mmdvmstack:local
    build:
      context: .
      dockerfile: Dockerfile.mmdvmstack
      args:
        <<: *build-jobs
        MMDVMSTACK_BASE_IMAGE: ${MMDVMSTACK_BASE_IMAGE:-error-set-mmdvmstack-base-image-see-env-example}
      additional_contexts:
        mmdvmhost: ../.cache/mmdvmstack/MMDVMHost
        dmrgw: ../.cache/mmdvmstack/DMRGateway
        ysfclients: ../.cache/mmdvmstack/YSFClients
        p25clients: ../.cache/mmdvmstack/P25Clients
        nxdnclients: ../.cache/mmdvmstack/NXDNClients
        dstargw: ../.cache/mmdvmstack/DStarGateway
    environment:
      MODEM_ADDR: ${DVT_NET:-172.30.0}.30
      MODEM_PORT: ${DVT_MMDVM_MODEM_PORT:-3334}
      LOCAL_ADDR: ${DVT_NET:-172.30.0}.100
      LOCAL_PORT: ${DVT_MMDVM_LOCAL_PORT:-3335}
      REFLECTOR_IP: ${DVT_NET:-172.30.0}.11
      REFLECTOR_NAME: ${DVT_REFLECTOR:-XLX999}
      CALLSIGN: N0CALL
      DMR_ID: "1023007"
      MODULE_DSTAR: ${DVT_MMDVM_MODULE_DSTAR:-H}
      MODULE_DMR: ${DVT_MMDVM_MODULE_DMR:-I}
      MODULE_YSF: ${DVT_MMDVM_MODULE_YSF:-J}
      P25_TG: ${DVT_MMDVM_P25_TG:-31672}
      NXDN_TG: ${DVT_MMDVM_NXDN_TG:-31672}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config/dmrid.dat:/mmdvm/dmrid.dat:ro
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.100"}

  # Load generator of the web load test (profile webload, together with web): many receive-only WebRTC
  # listeners (aiortc, pinned in .env.example) through the real HTTP signalling relay. A control server
  # (dvtest/tools/webload_gen.py serve) answers the tester only; it starts worker processes that each hold
  # whole logins. Own address (.97) = own login/join budgets of the web service (they count per client address).
  # The run CA is read from out/<run>/web (read-only). Nothing is written: tmpfs /tmp only, results leave as JSON.
  webload:
    <<: *limits-loadgen
    profiles: [webload]
    init: true
    restart: "no"
    image: dvt-webload:local
    build:
      context: .
      dockerfile: Dockerfile.webload
      args:
        TESTER_BASE_IMAGE: ${TESTER_BASE_IMAGE:-error-set-tester-base-image-see-env-example}
        WEBLOAD_PIP_PINS: ${WEBLOAD_PIP_PINS:-error-set-webload-pip-pins-see-env-example}
      additional_contexts:
        dvtest: ../dvtest
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    command: ["serve", "--port", "${DVT_WEBLOAD_PORT:-3100}", "--allow", "${DVT_NET:-172.30.0}.30"]
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/web:/webout:ro
    networks:
      rig:
        ipv4_address: "${DVT_NET:-172.30.0}.97"

  # Browsers for the browser cases (profile browser, together with web): `playwright run-server`
  # of the pinned official Playwright image (rig/Dockerfile.browser). The tester connects with the
  # Playwright client (chromium.connect / firefox.connect / webkit.connect); the pages are loaded
  # by the browsers from THIS address (.91) through the rig network, so the web service sees a
  # client address that is not the tester's. Non-root user of the image, no capability, root
  # filesystem read-only, /tmp in memory, shm_size for chromium (inside the memory cap).
  browser:
    <<: *limits-browser
    profiles: [browser]
    init: true
    restart: "no"
    image: dvt-browser:local
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_BASE_IMAGE:-error-set-browser-base-image-see-env-example}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
    shm_size: ${DVT_SHM_BROWSER:-1g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=512m
      # WebKit buffers media in /var/tmp/WebKit-Media-* (playback fails with "Could not create temp file" on a read-only root)
      - /var/tmp:size=256m
    # --unsafe: lets a client pass launch args and Firefox prefs (the fake microphone of the listen/talk
    # cases: --use-fake-device-for-media-stream, media.navigator.streams.fake). The rig network is
    # internal and the container is the boundary; the server takes no connection from outside it.
    command: ["--host", "0.0.0.0", "--port", "${DVT_BROWSER_PORT:-3000}", "--unsafe"]
    volumes:
      # fake microphone file written by the tester at run time (read-only here, never committed)
      - ../out/${DVT_RUN_ID:-manual}/media:/media:ro
    networks:
      rig:
        ipv4_address: "${DVT_NET:-172.30.0}.91"

  # ---- NAT profile (docs/rig.md "NAT profile", docs/web-nat-cases.md) ----
  # nat-router sits between the rig network (outside) and the internal network nat-inside, where only the
  # browser lives (rig/compose.nat.yml). Linux iptables NAT, switchable at run time by the JSON-line control
  # server (dvtest/tools/nat_router.py, outside address only, tester only). NET_ADMIN is its only capability.
  nat-router:
    <<: *nat
    # NET_RAW (with NET_ADMIN) only for the AF_PACKET sniffer of the `firsts` evidence of the ICE1 cases (docs/web-nat-cases.md):
    # it reads the SUT's media datagrams on the outside interface; this service alone, not the anchor
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    command:
      - python
      - -m
      - dvtest.tools.nat_router
      - --listen
      - ${DVT_NET:-172.30.0}.92:9100
      - --allow
      - ${DVT_NET:-172.30.0}.30
      - --inside-net
      - ${DVT_NAT_NET:-172.31.0}.0/24
      - --out-ip
      - ${DVT_NET:-172.30.0}.92
      - --in-ip
      - ${DVT_NAT_NET:-172.31.0}.2
      - --alias-ip
      - ${DVT_NET:-172.30.0}.93
      - --browser-ip
      - ${DVT_NAT_NET:-172.31.0}.91
      - --sut-ip
      - ${DVT_NET:-172.30.0}.11
      - --forward
      - "${DVT_BROWSER_PORT:-3000}"
      - --forward
      - "3001"
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.92"}
      nat-inside: {ipv4_address: "${DVT_NAT_NET:-172.31.0}.2"}

  # The probe server of the classification self-test and the default route of the browser: shares the network
  # namespace of the browser (the inside network is internal, so Docker gives the browser no gateway; this
  # sidecar adds the route through nat-router as root with NET_ADMIN, then drops to nobody).
  nat-edge:
    <<: *nat
    # SETUID/SETGID only to drop to nobody after the route is set (all capabilities go with the uid change)
    cap_add: [NET_ADMIN, SETUID, SETGID]
    network_mode: "service:browser"
    depends_on:
      browser: {condition: service_started, restart: false}
    command:
      - python
      - -m
      - dvtest.tools.nat_probe
      - --listen
      - 0.0.0.0:3001
      - --gateway
      - ${DVT_NAT_NET:-172.31.0}.2

  # UDP reflectors of the self-test (two outside addresses, so the mapping per destination address can be told)
  nat-ref-a:
    <<: *nat-helper
    command: [python, -m, dvtest.tools.nat_reflector, --listen, "${DVT_NET:-172.30.0}.95", --ports, "3479,3480", --poke-port, "3481"]
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.95"}

  nat-ref-b:
    <<: *nat-helper
    command: [python, -m, dvtest.tools.nat_reflector, --listen, "${DVT_NET:-172.30.0}.96", --ports, "3479,3480", --poke-port, "3481"]
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.96"}

  # TURN server (the official coturn image, pinned by tag and digest in .env.example, never pulled by run.sh).
  # Its config is generated by run.sh (dvtest/turn.py) with the per-run secret that is also the SUT's
  # turn_secret_file; mode 0600, owned by the host user this container runs as. UDP 3478 and the relay ports
  # 49160-49180 are on the rig network; no TLS (the network is offline).
  coturn:
    <<: *limits-medium
    profiles: [nat]
    init: true
    restart: "no"
    image: ${COTURN_IMAGE:-error-set-coturn-image-see-env-example}
    pull_policy: never
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    cap_drop: [ALL]
    # /usr/bin/turnserver carries the file capability cap_net_bind_service: the exec fails (EPERM) unless it is in
    # the bounding set. coturn listens on 3478, an unprivileged port, so nothing more than that is needed.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.94"}

  capture-mrefd:
    <<: *capture
    profiles: [capture-mrefd]
    network_mode: "service:mrefd"
    depends_on:
      mrefd: {condition: service_started, restart: false}
    command: ["mrefd"]

  # ---- XLX interlink peers (profile interlink) ----
  xlxd-peer-sut:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: &xlxd-peer-build
      context: .
      dockerfile: Dockerfile.xlxd
      args: *xlxd-args
      additional_contexts:
        src: ../.cache/xlxd/${XLXD_PEER_DIR:-ref}
    environment:
      DVT_CALLSIGN: XLX998
      DVT_IP: ${DVT_NET:-172.30.0}.12
      # no transcoder: the interlink carries every codec as is
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.11
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.12"}

  xlxd-peer-ref:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX998
      DVT_IP: ${DVT_NET:-172.30.0}.13
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.10
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.13"}

  xlxd-peer2-sut:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX997
      DVT_IP: ${DVT_NET:-172.30.0}.14
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.11
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.14"}

  xlxd-peer2-ref:
    <<: *xlxd
    profiles: [interlink]
    image: dvt-xlxd:${XLXD_PEER_DIR:-ref}
    build: *xlxd-peer-build
    environment:
      DVT_CALLSIGN: XLX997
      DVT_IP: ${DVT_NET:-172.30.0}.15
      DVT_TRANSCODER: 127.0.0.1
      DVT_INTERLINK: "on"
      DVT_INTERLINK_PEER: ${DVT_NET:-172.30.0}.10
      DVT_INTERLINK_CALLSIGN: XLX999
      DVT_INTERLINK_MODULES: ${DVT_INTERLINK_MODULES:-DE}
      DVT_START_DELAY: ${DVT_START_DELAY:-0}
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.15"}

  capture-xlxd-peer-sut:
    <<: *capture
    profiles: [capture-interlink]
    network_mode: "service:xlxd-peer-sut"
    depends_on:
      xlxd-peer-sut: {condition: service_started, restart: false}
    command: ["xlxd-peer-sut"]

  # ---- Second DV-Router node (profile twonode; docs/rig.md "Two DV-Router nodes") ----
  # The same prebuilt image as xlxd-sut (XLXD_SUT_IMAGE, never built or pulled here), started natively with its own
  # rendered config (scripts/run.sh render_dvr_peer: the SUT's template with --own 16 --transcoder 17 plus
  # rig/config/dv-router/dp15-twonode-b.toml), as a plain XLX interlink peer of xlxd-sut on modules DE. Hardened like the
  # other helpers: the host uid, no capabilities, read-only root; the run dir is a tmpfs (/run) and the recorder archive
  # is the host directory out/<run>/recorder-peer. Same pids and memory caps as xlxd-sut (a node is a launcher plus
  # about 25 children).
  dvr-peer:
    <<: *limits-medium
    profiles: [twonode]
    pids_limit: ${DVT_PIDS_SUT:-1024}
    mem_limit: ${DVT_MEM_SUT:-1g}
    memswap_limit: ${DVT_MEM_SUT:-1g}
    init: true
    restart: "no"
    image: ${XLXD_SUT_IMAGE:-error-set-xlxd-sut-image-for-the-twonode-profile}
    pull_policy: never
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    command: ["--config", "/etc/dv-router/dv-router.toml", "XLX998", "${DVT_NET:-172.30.0}.16", "${DVT_NET:-172.30.0}.17"]
    environment:
      DVT_CONFIG_MOUNTED: "1"
      DV_DMRPLUS_GATEWAY_ID: "1023000"
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/xlxd-config/dvr-peer/dv-router.toml:/etc/dv-router/dv-router.toml:ro
      - ./config/dmrid.dat:/xlxd/dmrid.dat:ro
      - ./config/nxdn.csv:/xlxd/nxdn.csv:ro
      - ../out/${DVT_RUN_ID:-manual}/recorder-peer:/var/lib/dv-recorder
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.16"}

  # The transcoder of dvr-peer: the same image as transcoder-sut (the fake extended AMBEd with DVT_TRANSCODER_FAKE=1), its
  # own address, so the two nodes never share a codec session table. Peers: dvr-peer and the tester.
  transcoder-peer:
    <<: *limits-medium
    profiles: [twonode]
    init: true
    image: ${TRANSCODER_SUT_IMAGE:-${TRANSCODER_IMAGE:-error-set-transcoder-image-env}}
    environment:
      DVT_TRANSCODER_BIND: ${DVT_NET:-172.30.0}.17
      DVT_TRANSCODER_PEERS: ${DVT_NET:-172.30.0}.16 ${DVT_NET:-172.30.0}.30
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.17"}

  # ---- netem sidecars (profile netem) ----
  netem-tester:
    <<: *netem
    network_mode: "service:tester"
    depends_on:
      tester: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_TESTER:-}

  netem-xlxd-ref:
    <<: *netem
    network_mode: "service:xlxd-ref"
    depends_on:
      xlxd-ref: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_XLXD:-}

  netem-xlxd-sut:
    <<: *netem
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_XLXD:-}

  # profile asl-edge: tcpdump (the lab agent only) inside the SUT's network namespace, agent at <net>.11:8099
  asl-tap:
    <<: [*asl-lab, *limits-small]
    network_mode: "service:xlxd-sut"
    depends_on:
      xlxd-sut: {condition: service_started, restart: false}
    environment:
      <<: *asl-lab-env
      DVT_ASL_ROLE: tap
      DVT_ASL_AGENT_PORT: "8099"

  # profile asl-edge: egress shaping of the lab nodes (control: "netem asl <args>")
  netem-asl-a:
    <<: *netem
    network_mode: "service:asl-a"
    depends_on:
      asl-a: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_ASL:-}

  netem-asl-b:
    <<: *netem
    network_mode: "service:asl-b"
    depends_on:
      asl-b: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_ASL:-}

  netem-asl-e:
    <<: *netem
    network_mode: "service:asl-e"
    depends_on:
      asl-e: {condition: service_started, restart: false}
    environment:
      DVT_NETEM_ARGS: ${DVT_NETEM_ARGS_ASL:-}

  # profile asl-nat (DVT_ASL_EDGE_NAT=1 with --profile asl-edge; case T5n, docs/asl-lab.md "T5n"): a source NAT for the
  # IAX2 socket of asl-a towards the edge, in asl-a's own network namespace (dvtest/asl_nat.py: one SNAT rule in the
  # nat table, the alias address .46 on asl-a's interface). Same image and tools as the web profile's NAT router
  # (Dockerfile.nat); NET_ADMIN is its only capability; control: JSON lines on asl-a's address, port 9101, tester only.
  # Not a routed NAT (no second network): see the docs for what that leaves out.
  asl-nat-a:
    <<: *nat
    profiles: [asl-nat]
    network_mode: "service:asl-a"
    depends_on:
      asl-a: {condition: service_started, restart: false}
    command:
      - python
      - -m
      - dvtest.tools.asl_nat
      - --listen
      - ${DVT_NET:-172.30.0}.42:9101
      - --allow
      - ${DVT_NET:-172.30.0}.30
      - --local-ip
      - ${DVT_NET:-172.30.0}.42
      - --alias-ip
      - ${DVT_NET:-172.30.0}.46
      - --peer-ip
      - ${DVT_NET:-172.30.0}.11
      - --port
      - "${DVT_ASL_IAX_PORT:-4569}"
      - --map-port
      - "44569"

  # ---- load (profile load): one client node per module ----
  # Each replica gets a dynamic address from <net>.128/25; DVT_LOAD_CMD (run
  # from /dvt) derives its module from that address (last octet - 128).
  load-node:
    <<: *limits-small
    profiles: [load]
    init: true
    image: dvt-tester:local
    scale: ${DVT_LOAD_NODES:-${DVT_LOAD_MODULES:-26}}
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    environment:
      DVT_LOAD_TARGET: ${DVT_NET:-172.30.0}.11
      DVT_LOAD_REF: ${DVT_NET:-172.30.0}.10
      DVT_LOAD_MODULES: ${DVT_LOAD_MODULES:-26}
      DVT_LOAD_START_AT: ${DVT_LOAD_START_AT:-0}
      DVT_LOAD_DURATION: ${DVT_LOAD_DURATION:-60}
      DVT_SUBNET: ${DVT_NET:-172.30.0}.0/24
      DVT_OUT: /dvt/out/${DVT_RUN_ID:-manual}
      HOME: /tmp
    volumes:
      - ..:/dvt
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ${DVT_LOAD_CMD:-python -m dvtest.load_node}"]
    networks: [rig]

  # ---- second Icom G3 terminal (profile g3) ----
  # G3 keys a terminal by IP: this relay gives the tester a second address.
  # The tester drives it over UDP 40100 (dvtest/proto/g3.py relay_main).
  g3-term2:
    <<: *limits-small
    profiles: [g3]
    init: true
    image: dvt-tester:local
    user: "${DVT_UID:-1000}:${DVT_GID:-1000}"
    working_dir: /dvt
    environment:
      HOME: /tmp
    volumes:
      - ..:/dvt
    entrypoint: ["python", "-m", "dvtest.proto.g3", "relay"]
    networks:
      rig: {ipv4_address: "${DVT_NET:-172.30.0}.31"}

networks:
  # profile nat: the network behind the NAT router. internal: Docker gives its containers no gateway and no
  # way out; only nat-router (attached to both networks) routes between them
  nat-inside:
    internal: true
    ipam:
      config:
        - subnet: ${DVT_NAT_NET:-172.31.0}.0/24
  rig:
    # internal: no route out; nothing in the rig may reach the internet
    internal: true
    ipam:
      config:
        - subnet: ${DVT_NET:-172.30.0}.0/24
          # dynamic addresses (load-node replicas) stay above the fixed ones
          ip_range: ${DVT_NET:-172.30.0}.128/25
  # profile asl-ext: the one network with a way out, attached to the service asl-ext only (docker NAT; no port is
  # published anywhere). Normal runs never create it.
  asl-ext-out:
    driver: bridge

# Added by scripts/run.sh (-f) for --profile twonode with DVT_NODE1G=on only (docs/node1g-cases.md, docs/rig.md "Hotspot link behind a WAN"): the
# second node dvr-peer becomes the HOTSPOT of a node link and leaves the rig network. It lives alone on the internal network nat-inside
# (DVT_NAT_NET, default 172.31.0.0/24) and reaches the central node (xlxd-sut) only through wan-router; its default route is set by
# wan-edge (a sidecar in its namespace). The tester gets an address on the inside network as well (the hotspot's LAN: P25 clients of the
# hotspot, the admin API of the hotspot) and keeps its rig address (the central node, the WAN router's control port).
#
# The hotspot's config is rendered by run.sh from rig/config/dv-router/node1g-hotspot.toml (a complete template: hotspot preset, one uplink row);
# it names no callsign / address words on the command line (the file has them). Its state dir is the host directory out/<run>/hotspot-state at
# /var/lib/dv (the admin users file and bootstrap secret live there; mode 0700, the host uid).
services:
  dvr-peer:
    networks: !override
      nat-inside:
        ipv4_address: "${DVT_NAT_NET:-172.31.0}.16"
    command: !override ["--config", "/etc/dv-router/dv-router.toml"]
    volumes:
      - ../out/${DVT_RUN_ID:-manual}/hotspot-state:/var/lib/dv
  tester:
    networks:
      nat-inside:
        ipv4_address: "${DVT_NAT_NET:-172.31.0}.30"

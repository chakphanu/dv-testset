# Snippet for DVT_SUT_CONFIG_EXTRA (native launch, docs/dp19b-cases.md): the AX.25 edge with ONE kiss-tcp port rf-a bound to room B (receive only) AND the text path
# that lets an APRS message to the room name become a room text, for the DP19b cases (cases/test_dp19b_status.py): statuses heard on the bound port enter room B as
# status items (a locator-bearing one is classified spatial from its original bytes), the message `:XLX999B  :IO91SX/G` is the look-alike TEXT. Same port as
# dp6c-rf.toml / dp7-rf.toml (use INSTEAD of those and dp15-rf.toml: all define [edges.ax25]). <TESTER_IP> is the tester, port 8101.
# The room name XLX999B has 7 characters, so no RF ack exists for it (data.md 9.4): alias_calls stays empty.
[edges.ax25]
enable = true
callsign = "N0TEST-1"
tx_enable = false
alias_calls = []

[[edges.ax25.port]]
name = "rf-a"
kind = "kiss-tcp"
host = "<TESTER_IP>"
port = 8101
channel = 0
room = "B"
tx = false
reconnect = { min_secs = 1, max_secs = 5 }

[[data.path]]
name = "dp19b-rf-in"
from = "edge:ax25"
to = "room:B"
types = ["text"]
addressee = "XLX999B"
per_min = 30

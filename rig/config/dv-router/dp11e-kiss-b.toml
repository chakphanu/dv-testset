# Snippet for DVT_SUT_CONFIG_EXTRA (docs/dp11e-cases.md): shape B of cases/test_dp11e_kiss.py, the KISS listeners that do not fit in the four of
# dp11e-kiss.toml: the loopback bind, the listener packet bucket and a SIMULATED port. Use it INSTEAD of dp11e-kiss.toml (both define [edges.ax25]).
# tx_budget = { duty_pct = 20, per_source_pct = 100 } on both ports, as in dp11e-kiss.toml (the class defaults hold only about four position frames per 600 s).
# The same station N0TEST-1, rf-a transmits (tx = true) and rf-b only SIMULATES (tx = "simulate": same gates and scheduler, counted
# dv_edge_rf_tx_total{result=simulated}, no modem byte; the physical is shared as in dp18-rf.toml).
#
#  loop   127.0.0.1:8205  no allow_from, loopback only: from the tester (another network namespace) the connection is refused
#  rate   <OWN_IP>:8206   rf-a = channel 0, tx true for the tester, allow_src N0TEST-7, tx_per_min 2 / tx_burst 1 (the listener bucket), keepalive 0
#  sim    <OWN_IP>:8207   rf-a = channel 0 (real) and rf-b = channel 1 (simulated), tx true for the tester, allow_src N0TEST-7, tx_per_min 30 / burst 5
[edges.ax25]
enable = true
callsign = "N0TEST-1"
tx_enable = true
alias_calls = []

[[edges.ax25.port]]
name = "rf-a"
kind = "kiss-tcp"
host = "<TESTER_IP>"
port = 8101
channel = 0
tx = true
physical = "radio1"
band = "2m"
class = "afsk1200-shared"
tx_budget = { duty_pct = 20, per_source_pct = 100 }
tx_per_min = 30
tx_burst = 5
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.port]]
name = "rf-b"
kind = "kiss-tcp"
host = "<TESTER_IP>"
port = 8102
channel = 0
tx = "simulate"
physical = "radio1"
band = "2m"
class = "afsk1200-shared"
tx_budget = { duty_pct = 20, per_source_pct = 100 }
tx_per_min = 30
tx_burst = 5
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.kiss_server]]
name = "loop"
listen = "127.0.0.1:8205"
ports = [{ name = "rf-a", channel = 0 }]
tx = false

[[edges.ax25.kiss_server]]
name = "rate"
listen = "<OWN_IP>:8206"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }]
tx = true
tx_from = ["<TESTER_IP>/32"]
allow_src = ["N0TEST-7"]
tx_per_min = 2
tx_burst = 1
keepalive_secs = 0

[[edges.ax25.kiss_server]]
name = "sim"
listen = "<OWN_IP>:8207"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }, { name = "rf-b", channel = 1 }]
tx = true
tx_from = ["<TESTER_IP>/32"]
allow_src = ["N0TEST-7"]
tx_per_min = 30
tx_burst = 5
keepalive_secs = 0

[[edges.ax25.kiss_server]]
name = "txdefault"
listen = "<OWN_IP>:8208"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }]
tx = true
allow_src = ["N0TEST-7"]
keepalive_secs = 0

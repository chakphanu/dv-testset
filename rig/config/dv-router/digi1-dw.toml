# SPDX-License-Identifier: MIT
# Snippet for DVT_SUT_CONFIG_EXTRA (native launch, docs/digi1-cases.md "Tier B"): the AX.25 edge with the fill-in digipeater (DIGI1) behind a
# REAL Dire Wolf TNC for DIGI-R1b (cases/test_digi1_dw.py). Like dp15-rf-dw.toml (profile dw: dw-a <NET>.48, dw-b <NET>.49, KISS TCP 8001,
# modem loop, scripts/run.sh --profile web,dw) with the budget of digi1-roomy.toml:
#
#   rf-a  on dw-a: hears what the tester sends into dw-b, repeats on the same port (digipeating, TX)
#   rf-b  on dw-b: rx only; it hears what rf-a transmits (the repeat) - and so does the tester, the second KISS client of dw-b
#
# The Dire Wolf TNCs have NO digipeater configured (the loop configuration has no DIGIPEAT line), as the edge requires. Use it AFTER
# data-ident.toml, INSTEAD of dp15-rf-dw.toml.
[edges.ax25]
enable = true
callsign = "N0TEST-10"
tx_enable = true
alias_calls = []

[[edges.ax25.port]]
name = "rf-a"
kind = "kiss-tcp"
host = "<NET>.48"
port = 8001
channel = 0
tx = true
physical = "radio1"
band = "2m"
class = "afsk1200-shared"
tx_budget = { duty_pct = 20 }
tx_per_min = 30
tx_burst = 10
digi = { enable = true }
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.port]]
name = "rf-b"
kind = "kiss-tcp"
host = "<NET>.49"
port = 8001
channel = 0
tx = false
reconnect = { min_secs = 1, max_secs = 5 }

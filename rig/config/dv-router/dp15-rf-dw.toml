# Snippet for DVT_SUT_CONFIG_EXTRA (native launch, docs/rig.md, docs/dp15-cases.md): the AX.25 edge with two kiss-tcp ports
# that connect to REAL Dire Wolf TNCs for the DP15 RF cases of tier B (cases/test_dp15_rf_dw.py). The rig profile dw
# (scripts/run.sh --profile web,dw) runs the two TNCs dw-a (<NET>.48) and dw-b (<NET>.49), KISS TCP port 8001 each, on a
# modem loop: what one TRANSMITS the other demodulates (docs/direwolf-cases.md "Modem loop"). The AX.25 edge is the kiss-tcp
# CLIENT of both; after every connect it writes the five KISS parameter frames per channel (TXDELAY, P, SlotTime, TXtail,
# FullDuplex), which Dire Wolf logs and applies. Use it AFTER data-ident.toml (the data worker must be on), instead of
# dp15-rf.toml (the same port names rf-a / rf-b, the same path rf-in, the same token and the same split):
#
#   rf-a  tx and rx, on dw-a: room text leaves here (dp15-rf-out.toml) and the tester injects "RF" heard by it through dw-b
#   rf-b  rx only, on dw-b: it hears what dw-a transmits, i.e. the edge's own frames (an own identity: ignored, data.md 9.1)
#
# <DP15_TX_ENABLE> (env DVT_DP15_TX_ENABLE, true or false, default false) is the master switch tx_enable AND the tx switch of
# port rf-a, exactly as in dp15-rf.toml: the launcher refuses `tx = true` without `tx_enable = true`, and a path TO an RF port
# unless both are true. Therefore:
#   DVT_DP15_TX_ENABLE=false (default)  this snippet alone: receive only, no path to RF (DP15-6b off half)
#   DVT_DP15_TX_ENABLE=true             this snippet AND dp15-rf-out.toml (the path room B -> rf-a); the launcher
#                                       refuses dp15-rf-out.toml with the token false
#
# Callsign N0TEST-1 is the station callsign of every frame this node transmits (synthetic; base of 6 characters with a digit).
# The room name XLX999B has 7 characters and cannot be an AX.25 address, so no RF ack exists for it (data.md 9.4).
# reconnect = 1..5 s: the edge starts before the Dire Wolf containers listen, so it must retry quickly. The tester is the second
# KISS client of each TNC (Dire Wolf serves three at a time).
[edges.ax25]
enable = true
callsign = "N0TEST-1"
tx_enable = <DP15_TX_ENABLE>
alias_calls = []

[[edges.ax25.port]]
name = "rf-a"
kind = "kiss-tcp"
host = "<NET>.48"
port = 8001
channel = 0
tx = <DP15_TX_ENABLE>
physical = "radio1"
band = "2m"
class = "afsk1200-shared"
tx_budget = {}
tx_per_min = 2
tx_burst = 1
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.port]]
name = "rf-b"
kind = "kiss-tcp"
host = "<NET>.49"
port = 8001
channel = 0
tx = false
reconnect = { min_secs = 1, max_secs = 5 }

[[data.path]]
name = "rf-in"
from = "edge:ax25"
to = "room:B"
types = ["text"]
addressee = "XLX999B"
per_min = 30

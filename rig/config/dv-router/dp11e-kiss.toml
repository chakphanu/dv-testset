# Snippet for DVT_SUT_CONFIG_EXTRA (native launch, docs/dp11e-cases.md): the AX.25 edge with the KISS TCP SERVERS of DP11e
# (`[[edges.ax25.kiss_server]]`, data.md 10.10, config.md) next to two fake KISS modems played by the tester (dvtest/kiss_tnc.py, as RF tier A of
# cases/test_dp15_rf.py): the edge is a kiss-tcp CLIENT of <TESTER_IP>:8101 (rf-a, transmits) and :8102 (rf-b, receive only), and a SERVER on
# <OWN_IP>:8201..8204 for the tester's headless APRS app (dvtest/kiss_app.py). Use it INSTEAD of dp15-rf.toml (both define [edges.ax25]).
# Shape K of cases/test_dp11e_kiss.py; shape B (dp11e-kiss-b.toml) holds the listeners that do not fit in four.
# Station callsign N0TEST-1; client sources are SSIDs of the station base: N0TEST-7 and N0TEST-8.
#
#  apps     :8201  allow_from the tester, ports rf-a = channel 0 and rf-b = channel 1 (receive only: a client frame there is `tx_off`), tx true,
#                  tx_from the tester, allow_src N0TEST-7 / N0TEST-8, max_clients 3, keepalive_secs 10 (SHORT, so the keepalive case stays short)
#  rxonly   :8202  allow_from the tester, rf-a = channel 0, tx false, keepalive_secs 0
#  txdeny   :8203  allow_from the tester, rf-a = channel 0, tx true but tx_from 192.0.2.0/24 (documentation range, not the tester): `tx_addr`
#  outside  :8204  allow_from 192.0.2.0/24 only: the tester is refused before any byte is read (`refused_addr`)
# The ports 8201..8204 are on the rig network; <OWN_IP> is the SUT. tx_per_min 30 / tx_burst 5 on rf-a and on `apps`: the cases send several
# frames in a row and must not be slowed by the coarse port bucket (the `rate` case uses shape B).
[edges.ax25]
enable = true
callsign = "N0TEST-1"
tx_enable = true
alias_calls = []

[[edges.ax25.port]]
name = "rf-a"
kind = "kiss-tcp"
host = "<TESTER_IP>"
port = 8101
channel = 0
tx = true
physical = "radio1"
band = "2m"
class = "afsk1200-shared"
tx_budget = {}
tx_per_min = 30
tx_burst = 5
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.port]]
name = "rf-b"
kind = "kiss-tcp"
host = "<TESTER_IP>"
port = 8102
channel = 0
tx = false
reconnect = { min_secs = 1, max_secs = 5 }

[[edges.ax25.kiss_server]]
name = "apps"
listen = "<OWN_IP>:8201"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }, { name = "rf-b", channel = 1 }]
tx = true
tx_from = ["<TESTER_IP>/32"]
allow_src = ["N0TEST-7", "N0TEST-8"]
max_clients = 3
tx_per_min = 30
tx_burst = 5
max_hops = 2
keepalive_secs = 10

[[edges.ax25.kiss_server]]
name = "rxonly"
listen = "<OWN_IP>:8202"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }]
tx = false
keepalive_secs = 0

[[edges.ax25.kiss_server]]
name = "txdeny"
listen = "<OWN_IP>:8203"
allow_from = ["<TESTER_IP>/32"]
ports = [{ name = "rf-a", channel = 0 }]
tx = true
tx_from = ["192.0.2.0/24"]
allow_src = ["N0TEST-7"]
keepalive_secs = 0

[[edges.ax25.kiss_server]]
name = "outside"
listen = "<OWN_IP>:8204"
allow_from = ["192.0.2.0/24"]
ports = [{ name = "rf-a", channel = 0 }]
tx = false
keepalive_secs = 0

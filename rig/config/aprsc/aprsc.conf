# SPDX-License-Identifier: MIT
# Fixture config of the PRIVATE aprsc server of the rig (compose service aprsc, profile aprs; docs/rig.md,
# docs/dp15-cases.md DP15-5a / 5b). Mounted read-only at /etc/aprsc/aprsc.conf and also checked by
# `aprsc -y` when the image is built (rig/Dockerfile.aprsc). Nothing here is a credential.
#
# Standalone: no Uplink, no peer group, no HTTPStatus / HTTPUpload listener (so no HTTP port at all), no
# internet; the rig network is internal anyway. One client port, 14580, of type igate (user-defined filters
# allowed); noIS2upgrade keeps the plain APRS-IS text protocol (the in-band IS2 offer is off).
#
# Logins: the server verifies `pass N` against the public APRS passcode hash of the login callsign
# (dvtest/aprs_passcode.py); a wrong or missing passcode logs in "unverified" and its packets are dropped
# (disallow_unverified defaults to on). The server's own PassCode below is a fixture value.
# A packet source starting with N0CALL, NOCALL or SERVER is dropped by aprsc: the cases use N0TEST-n.
# The log goes to stderr (docker logs); the pid file is /tmp/aprsc.pid (command line).
ServerId   DVTEST
PassCode   0
MyAdmin    "dv-testset fixture, N0TEST"
MyEmail    aprsc@example.net
RunDir     /tmp
ClientTimeout 48h
LogInTimeout  30s
Listen "Client-Defined Filters" igate tcp 0.0.0.0 14580 noIS2upgrade

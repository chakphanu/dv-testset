; IAX2 callers (the tester) land on a node with Rpt(<node>,X).
[general]
static = yes
writeprotect = yes

[dvt-iax]
exten => 1901,1,Answer()
 same => n,Rpt(1901,X)
 same => n,Hangup()
exten => 1902,1,Answer()
 same => n,Rpt(1902,X)
 same => n,Hangup()

[dvt-radio]
exten => _X.,1,Hangup()

# P25Reflector config for the dv-testset rig: foreground, log on stdout only,
# synthetic ID file. A P25Reflector is a single room (no talkgroup setting).
[General]
Daemon=0

[Id Lookup]
Name=/p25/DMRIds.dat
Time=24

[Log]
DisplayLevel=1
FileLevel=0
FilePath=/tmp
FileRoot=P25Reflector
FileRotate=0

[Network]
Port=41000
Debug=0

; SPDX-License-Identifier: MIT
; asl-lab dialplan. Inbound IAX2 calls land in [radio-secure] (node links,
; user radio) or [radio-acct] (account users). Every inbound call records the
; audio it RECEIVES from the peer (MixMonitor option r(): *-rx.sln, raw 8 kHz signed
; linear, no header to finalise, plus the mix of both directions in *-mix.sln) under
; /var/spool/asterisk/dvt-rec/<scenario>/. The scenario is the global DVT_SCEN,
; set through the agent (dialplan set global); the node number is the
; environment variable DVT_NODE of the asterisk process.
[general]
static = yes
writeprotect = no

[globals]
DVT_SCEN=none

[radio-secure]
exten => _X.,1,NoOp(link call to ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${EXTEN}" = "${ENV(DVT_NODE)}"]?ok:bad)
 same => n(bad),Hangup()
 same => n(ok),Set(REC=/var/spool/asterisk/dvt-rec/${DVT_SCEN}/${EXTEN}-from-${CALLERID(num)}-${STRFTIME(${EPOCH},,%H%M%S)})
 same => n,MixMonitor(${REC}-mix.sln,r(${REC}-rx.sln))
 same => n,Rpt(${EXTEN})
 same => n,Hangup()

[radio-acct]
exten => _X.,1,NoOp(account call to ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${EXTEN}" = "${ENV(DVT_NODE)}"]?ok:bad)
 same => n(bad),Hangup()
 same => n(ok),Set(REC=/var/spool/asterisk/dvt-rec/${DVT_SCEN}/${EXTEN}-acct-${STRFTIME(${EPOCH},,%H%M%S)})
 same => n,MixMonitor(${REC}-mix.sln,r(${REC}-rx.sln))
 same => n,Rpt(${EXTEN},X)
 same => n,Hangup()

[radio-local]
exten => _X.,1,Hangup()

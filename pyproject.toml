[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvtest"
version = "0.1.0"
description = "Black-box test clients and rig for digital-voice protocols and the servers that speak them"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dvtest*"]

[tool.pytest.ini_options]
testpaths = ["cases"]
markers = [
    "unit: offline codec round trips, no network",
    "wire: needs a running transcoder (DVT_AMBED_ADDR or TRANSCODER_IMAGE)",
    "netns: needs a built xlxd (pre-fetch-xlxd.sh + make) and unshare -rn",
    "rig: needs the docker rig (rig/compose.yml, profile core)",
    "allstar: needs the docker rig with profile allstar",
    "asl_lab: needs the docker rig with profile asl-lab (AllStarLink test lab, docs/asl-lab.md)",
    "asl_ext: EXTERNAL (real AllStarLink network): needs --profile asl-ext, DVT_ASL_EXT_GO and the node password file (cases/test_asl_ext.py)",
    "nxdn: needs the docker rig with profile nxdn",
    "p25: needs the docker rig with profile p25",
    "load: needs the docker rig with profile load (many modules at once)",
    "interlink: needs the docker rig with profile interlink",
    "web: needs the docker rig with profile web (DV-Router web service behind the TLS proxy)",
    "browser: needs the docker rig with profiles web and browser (Playwright browsers; cases/test_web_browser.py)",
    "nat: needs the docker rig with profiles web, browser and nat (NAT router, coturn; cases/test_web_nat.py)",
    "webrtc: browser cases of WebRTC Listen/Talk and recorder playback (cases/test_web_webrtc.py, cases/test_web_recorder.py)",
    "speech: needs the fetched speech corpus (scripts/pre-fetch-speech.sh)",
    "slow: long-running cases (minutes), e.g. tot_180s",
    "interop: protocol interop, always judged against xlxd-ref",
    "behaviour: reflector behaviour, follows DVT_SUT_PROFILE (dvtest/specs)",
    "crossmode: needs cross-mode audio through the system under test's transcoding",
    "radio_id: the sut expectation depends on DVT_NO_RADIO_ID (talker without a real radio id)",
    "cfgload: host-side config-load cases, `dv-router config check` on mutated rendered templates in a throw-away container (cases/test_config_load.py, docs/config-load-cases.md); NOT rig",
    "proto: per-protocol conformance case (docs/protocols/<protocol>.md, testlist K)",
]
